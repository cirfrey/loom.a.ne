[host_machine]
system     = 'none'
cpu_family = 'xtensa'
cpu        = 'esp32s2'
endian     = 'little'

[binaries]
cc      = 'artifact-esp32s2-cc'
cpp     = 'artifact-esp32s2-cxx'
ar      = 'artifact-esp32s2-ar'
strip   = 'artifact-esp32s2-strip'
objcopy = 'artifact-esp32s2-objcopy'

[properties]
environment = 'lolin_s2_mini'
board       = 'lolin_s2_mini'
arch        = 'xtensa'
toolchain   = 'esp32s2'

flash_size  = '4194304'   # 4 MB
ram_size    = '327680'    # 320 KB

[built-in options]
needs_exe_wrapper = true
cpp_std           = 'c++20'
